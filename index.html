function loadAppData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_DATA);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(DEFAULT_DATA),
      ...parsed,
      profil: { ...DEFAULT_DATA.profil, ...(parsed.profil || {}) },
      bobotNilai: { ...DEFAULT_DATA.bobotNilai, ...(parsed.bobotNilai || {}) }
    };
  } catch (e) {
    console.error('Gagal memuat localStorage:', e);
    return structuredClone(DEFAULT_DATA);
  }
}

function saveAppData(silent = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    updateHeaderBadges();
    if (!silent) showToast('Data tersimpan secara lokal', 'success');
  } catch (e) {
    showToast('Gagal menyimpan ke memori browser: ' + e.message, 'error');
  }
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  const colors = {
    success: 'bg-emerald-800 text-white border-emerald-700',
    error: 'bg-rose-700 text-white border-rose-600',
    info: 'bg-slate-800 text-white border-slate-700'
  };
  el.className = `px-4 py-2.5 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-2 transition-all duration-300 ${colors[type] || colors.info}`;
  el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span>${esc(message)}</span>`;
  container.appendChild(el);
  lucide.createIcons();
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
  }, 2800);
}

/**
 * ============================================================================
 * PERHITUNGAN NILAI OTOMATIS (KOGNITIF, PSIKOMOTOR, AFEKTIF, NILAI AKHIR)
 * ============================================================================
 */
function getSiswaKelasAktif() {
  return appData.siswa.filter(s => s.kelas === appData.profil.kelasAktif);
}

function getTPByMapelSemester(mapelId, semester) {
  return appData.tpList.filter(tp => tp.mapelId === mapelId && tp.semester === semester);
}

function calcKognitifDetail(siswaId, mapelId, semester) {
  const tps = getTPByMapelSemester(mapelId, semester);
  const key = `${semester}|${mapelId}|${siswaId}`;
  const rec = appData.nilaiKognitif[key] || { tpScores: {}, sas: '' };
  let sumF = 0, cntF = 0, sumS = 0, cntS = 0;
  const tpEvaluations = [];

  tps.forEach(tp => {
    const sc = rec.tpScores?.[tp.id] || {};
    const f = sc.formatif !== '' && sc.formatif !== undefined && !isNaN(Number(sc.formatif)) ? Number(sc.formatif) : null;
    const s = sc.sumatif !== '' && sc.sumatif !== undefined && !isNaN(Number(sc.sumatif)) ? Number(sc.sumatif) : null;
    if (f !== null) { sumF += f; cntF++; }
    if (s !== null) { sumS += s; cntS++; }
    const avgTp = (f !== null && s !== null) ? (f + s) / 2 : (s !== null ? s : f);
    if (avgTp !== null) {
      tpEvaluations.push({ tp, score: avgTp });
    }
  });

  const avgFormatif = cntF > 0 ? +(sumF / cntF).toFixed(1) : 0;
  const avgSumatif = cntS > 0 ? +(sumS / cntS).toFixed(1) : 0;
  const sasVal = rec.sas !== '' && rec.sas !== undefined && !isNaN(Number(rec.sas)) ? Number(rec.sas) : 0;
  const hasAny = cntF > 0 || cntS > 0 || (rec.sas !== '' && rec.sas !== undefined);

  return {
    tps,
    rec,
    avgFormatif,
    avgSumatif,
    sasVal,
    hasAny,
    tpEvaluations
  };
}

function calc7KebiasaanAvg(storeObj, siswaId, semester) {
  const key = `${semester}|${siswaId}`;
  const rec = storeObj[key] || {};
  let sum = 0, cnt = 0;
  TUJUH_KEBIASAAN.forEach(k => {
    const v = rec[k.id];
    if (v !== '' && v !== undefined && !isNaN(Number(v))) {
      sum += Number(v);
      cnt++;
    }
  });
  return cnt > 0 ? +(sum / cnt).toFixed(1) : 85; // Default 85 jika belum diisi
}

function calcNilaiAkhirMapel(siswaId, mapelId, semester) {
  const kog = calcKognitifDetail(siswaId, mapelId, semester);
  const psi = calc7KebiasaanAvg(appData.nilaiPsikomotor, siswaId, semester);
  const afe = calc7KebiasaanAvg(appData.nilaiAfektif, siswaId, semester);
  const b = appData.bobotNilai;
  const totalBobot = (Number(b.formatif) + Number(b.sumatif) + Number(b.sas) + Number(b.psikomotor) + Number(b.afektif)) || 100;

  const raw = (
    kog.avgFormatif * Number(b.formatif) +
    kog.avgSumatif * Number(b.sumatif) +
    kog.sasVal * Number(b.sas) +
    psi * Number(b.psikomotor) +
    afe * Number(b.afektif)
  ) / totalBobot;

  return {
    avgFormatif: kog.avgFormatif,
    avgSumatif: kog.avgSumatif,
    sasVal: kog.sasVal,
    psikomotor: psi,
    afektif: afe,
    nilaiAkhir: Math.round(raw),
    tpEvaluations: kog.tpEvaluations
  };
}

function changeCalMonth(delta) {
  uiState.calMonth += delta;
  if (uiState.calMonth < 0) { uiState.calMonth = 11; uiState.calYear--; }
  if (uiState.calMonth > 11) { uiState.calMonth = 0; uiState.calYear++; }
  renderApp();
}

function resetCalToday() {
  const now = new Date();
  uiState.calYear = now.getFullYear();
  uiState.calMonth = now.getMonth();
  renderApp();
}

function openAgendaModal(dateStr) {
  const list = appData.kalenderAgenda[dateStr] || [];
  const formatted = new Date(dateStr + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  openModal(`Agenda Sekolah — ${formatted}`, `
    <div class="space-y-4">
      <div class="space-y-2">
        <div class="text-xs font-bold text-slate-500 uppercase">Daftar Agenda pada Tanggal Ini</div>
        ${list.length ? list.map(ag => `
          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
            <div>
              <div class="text-sm font-bold text-slate-800">${esc(ag.judul)}</div>
              <div class="text-xs text-slate-500">${esc(ag.kategori)}</div>
            </div>
            <button onclick="deleteAgenda('${dateStr}', '${ag.id}')" class="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        `).join('') : '<div class="text-xs text-slate-400 italic py-2">Belum ada agenda pada tanggal ini.</div>'}
      </div>

      <form onsubmit="saveAgenda(event, '${dateStr}')" class="pt-3 border-t border-slate-200 space-y-3">
        <div class="text-xs font-bold text-emerald-700 uppercase">+ Tambah Agenda Baru</div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Kegiatan / Agenda</label>
          <input type="text" id="agJudul" required placeholder="Contoh: Rapat Pramuka / Workshop / PTS" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:border-emerald-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Kategori</label>
            <select id="agKategori" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl">
              <option>Kegiatan Sekolah</option>
              <option>Akademik / Ujian</option>
              <option>Rapat Guru</option>
              <option>Hari Besar / Libur</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Penanda Warna</label>
            <select id="agWarna" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl">
              <option value="amber">Kuning (Agenda Umum)</option>
              <option value="blue">Biru (Kegiatan Resmi)</option>
              <option value="emerald">Hijau (Akademik)</option>
              <option value="rose">Merah (Ujian / Penting)</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold">Simpan Agenda ke Kalender</button>
      </form>
    </div>
  `);
}

function saveAgenda(e, dateStr) {
  e.preventDefault();
  const judul = document.getElementById('agJudul').value.trim();
  const kategori = document.getElementById('agKategori').value;
  const warna = document.getElementById('agWarna').value;
  if (!judul) return;
  if (!appData.kalenderAgenda[dateStr]) appData.kalenderAgenda[dateStr] = [];
  appData.kalenderAgenda[dateStr].push({ id: 'AG-' + Date.now(), judul, kategori, warna });
  saveAppData();
  openAgendaModal(dateStr);
  renderApp();
}

function deleteAgenda(dateStr, agId) {
  appData.kalenderAgenda[dateStr] = (appData.kalenderAgenda[dateStr] || []).filter(a => a.id !== agId);
  if (appData.kalenderAgenda[dateStr].length === 0) delete appData.kalenderAgenda[dateStr];
  saveAppData();
  openAgendaModal(dateStr);
  renderApp();
}

function openAddAnnouncementModal() {
  openModal('Tambah Catatan / Pengumuman Beranda', `
    <form onsubmit="saveAnnouncement(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Isi Pengumuman</label>
        <textarea id="annIsi" rows="3" required placeholder="Tulis pengingat atau informasi sekolah..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:border-emerald-500 focus:outline-none"></textarea>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-700 text-white text-xs font-bold hover:bg-emerald-800">Terbitkan ke Beranda</button>
    </form>
  `);
}

function saveAnnouncement(e) {
  e.preventDefault();
  const isi = document.getElementById('annIsi').value.trim();
  if (!isi) return;
  appData.pengumuman.unshift({ id: 'ANN-' + Date.now(), penulis: appData.profil.namaGuru.split(',')[0], waktu: 'Baru saja', isi });
  saveAppData();
  closeModal();
  renderApp();
}

function deleteAnnouncement(id) {
  appData.pengumuman = appData.pengumuman.filter(a => a.id !== id);
  saveAppData();
  renderApp();
}

    alamatSekolah: document.getElementById('profAlamat').value.trim(),
    namaGuru: document.getElementById('profGuru').value.trim(),
    nipGuru: document.getElementById('profNipGuru').value.trim(),

/**
 * ============================================================================
 * 4. DAFTAR HADIR MURID (INPUT MASSAL + REKAP BULANAN CETAK RESMI)
 * ============================================================================
 */
function renderAbsensi() {
  const p = appData.profil;
  const siswaKelas = getSiswaKelasAktif();
  const tgl = uiState.absensiDate;
  const bulanPrefix = tgl.slice(0, 7);

  let hCount = 0, sCount = 0, iCount = 0, aCount = 0;
  siswaKelas.forEach(s => {
    const rec = appData.absensi[`${tgl}|${s.id}`];
    const st = rec ? rec.status : 'Hadir';
    if (st === 'Hadir') hCount++;
    else if (st === 'Sakit') sCount++;
    else if (st === 'Izin') iCount++;
    else if (st === 'Alpa') aCount++;
  });

  return `
    ${renderOfficialPrintHeader('Rekapitulasi Daftar Hadir Peserta Didik', `Tanggal: ${tgl} (Bulan ${bulanPrefix})`)}
    <div class="space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3 no-print">
        <div>
          <h2 class="font-heading text-xl font-extrabold text-slate-800">Daftar Hadir Murid — Kelas ${esc(p.kelasAktif)}</h2>
          <p class="text-xs text-slate-500">Input massal harian sekaligus akumulasi otomatis ke Rapor & Cetak Rekap Bulanan</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <input type="date" value="${esc(tgl)}" onchange="uiState.absensiDate=this.value; renderApp()" class="px-3 py-2 text-xs font-bold bg-white border border-slate-300 rounded-xl" />
          <button onclick="setAllAbsensiHadir()" class="px-3 py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold hover:bg-emerald-100">Hadir Semua</button>
          <button onclick="saveBulkAbsensi()" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold flex items-center gap-1.5">
            <i data-lucide="save" class="w-4 h-4"></i> Simpan Absensi
          </button>
          <button onclick="window.print()" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 hover:bg-slate-50 text-xs font-bold flex items-center gap-1.5">
            <i data-lucide="printer" class="w-4 h-4"></i> Cetak Rekap
          </button>
        </div>
      </div>

      <!-- KPI Cards -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 no-print">
        <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5">
          <div class="text-xs text-emerald-700 font-semibold">Hadir Hari Ini</div>
          <div class="font-heading text-2xl font-extrabold text-emerald-900">${hCount}</div>
        </div>
        <div class="bg-sky-50 border border-sky-200 rounded-2xl p-3.5">
          <div class="text-xs text-sky-700 font-semibold">Sakit</div>
          <div class="font-heading text-2xl font-extrabold text-sky-900">${sCount}</div>
        </div>
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5">
          <div class="text-xs text-amber-700 font-semibold">Izin</div>
          <div class="font-heading text-2xl font-extrabold text-amber-900">${iCount}</div>
        </div>
        <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3.5">
          <div class="text-xs text-rose-700 font-semibold">Alpa</div>
          <div class="font-heading text-2xl font-extrabold text-rose-900">${aCount}</div>
        </div>
      </div>

      <div class="bg-white rounded-3xl border border-slate-200/80 overflow-hidden shadow-2xs print-card">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-800 text-white text-xs uppercase">
                <th class="py-3 px-4 w-12 text-center">No</th>
                <th class="py-3 px-4">Nama Murid</th>
                <th class="py-3 px-4 text-center">Status Kehadiran (${esc(tgl)})</th>
                <th class="py-3 px-4 text-center">Rekap Bulan ${esc(bulanPrefix)} (H/S/I/A)</th>
                <th class="py-3 px-4 no-print">Keterangan</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${siswaKelas.map((s, idx) => {
                const rec = appData.absensi[`${tgl}|${s.id}`] || { status: 'Hadir', keterangan: '' };
                // Hitung akumulasi bulan berjalan
                let mH = 0, mS = 0, mI = 0, mA = 0;
                Object.entries(appData.absensi).forEach(([k, val]) => {
                  if (k.startsWith(bulanPrefix) && k.endsWith(`|${s.id}`)) {
                    if (val.status === 'Hadir') mH++;
                    else if (val.status === 'Sakit') mS++;
                    else if (val.status === 'Izin') mI++;
                    else if (val.status === 'Alpa') mA++;

                });
                return `
                  <tr>
                    <td class="py-2.5 px-4 text-center font-semibold text-slate-500">${idx + 1}</td>
                    <td class="py-2.5 px-4">

                    <td class="py-2.5 px-4 text-center">
                      <div class="inline-flex rounded-xl border border-slate-200 overflow-hidden no-print">
                        ${['Hadir', 'Sakit', 'Izin', 'Alpa'].map(st => `
                          <label class="cursor-pointer px-2.5 py-1 text-xs font-bold ${rec.status === st ? 'bg-emerald-700 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}">
                            <input type="radio" name="abs_${s.id}" value="${st}" ${rec.status === st ? 'checked' : ''} onchange="updateAbsensiRow('${s.id}', this.value)" class="hidden" />

                      <span class="print-only-block font-bold">${esc(rec.status)}</span>

                      <span class="text-emerald-700">${mH}</span> / <span class="text-sky-700">${mS}</span> / <span class="text-amber-700">${mI}</span> / <span class="text-rose-700">${mA}</span>
                    </td>
                    <td class="py-2.5 px-4 no-print">
                      <input type="text" id="absKet_${s.id}" value="${esc(rec.keterangan)}" placeholder="Catatan..." class="w-full px-2.5 py-1 text-xs border border-slate-200 rounded-lg" />
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
    ${renderOfficialPrintSignature()}
  `;
}

function updateAbsensiRow(siswaId, status) {
  const tgl = uiState.absensiDate;
  const ket = document.getElementById(`absKet_${siswaId}`)?.value || '';
  appData.absensi[`${tgl}|${siswaId}`] = { status, keterangan: ket };
  renderApp();
}

function setAllAbsensiHadir() {
  const tgl = uiState.absensiDate;
  getSiswaKelasAktif().forEach(s => {
    appData.absensi[`${tgl}|${s.id}`] = { status: 'Hadir', keterangan: '' };
  });
  saveAppData();
  renderApp();
}

function saveBulkAbsensi() {
  const tgl = uiState.absensiDate;
  getSiswaKelasAktif().forEach(s => {
    const checked = document.querySelector(`input[name="abs_${s.id}"]:checked`);
    const ket = document.getElementById(`absKet_${s.id}`)?.value || '';
    appData.absensi[`${tgl}|${s.id}`] = {
      status: checked ? checked.value : 'Hadir',
      keterangan: ket
    };
  });
  saveAppData();
  renderApp();
}

function saveBulkKognitif(mapelId) {
  const sem = appData.profil.semesterAktif;
  const tps = getTPByMapelSemester(mapelId, sem);
  getSiswaKelasAktif().forEach(s => {
    const key = `${sem}|${mapelId}|${s.id}`;
    const tpScores = {};
    tps.forEach(tp => {
      const fEl = document.querySelector(`input[data-kog-f="${s.id}|${tp.id}"]`);
      const sEl = document.querySelector(`input[data-kog-s="${s.id}|${tp.id}"]`);
      tpScores[tp.id] = {
        formatif: fEl ? fEl.value : '',
        sumatif: sEl ? sEl.value : ''
      };
    });
    const sasEl = document.querySelector(`input[data-kog-sas="${s.id}"]`);
    appData.nilaiKognitif[key] = {
      tpScores,
      sas: sasEl ? sasEl.value : ''
    };
  });
  saveAppData();
  renderApp();
}

function quickFill7Kebiasaan(tab, val) {
  document.querySelectorAll(`input[data-keb-${tab}]`).forEach(inp => { inp.value = val; });
  saveBulk7Kebiasaan(tab);
}

function saveBulk7Kebiasaan(tab) {
  const sem = appData.profil.semesterAktif;
  const storeObj = tab === 'psikomotor' ? appData.nilaiPsikomotor : appData.nilaiAfektif;
  getSiswaKelasAktif().forEach(s => {
    const key = `${sem}|${s.id}`;
    const rec = {};
    TUJUH_KEBIASAAN.forEach(k => {
      const inp = document.querySelector(`input[data-keb-${tab}="${s.id}|${k.id}"]`);
      rec[k.id] = inp && inp.value !== '' ? Number(inp.value) : 85;
    });
    storeObj[key] = rec;
  });
  saveAppData();
  renderApp();
}

function updateBobotNilai() {
  const f = Number(document.getElementById('bobotFormatif').value) || 0;
  const s = Number(document.getElementById('bobotSumatif').value) || 0;
  const sas = Number(document.getElementById('bobotSas').value) || 0;
  const psi = Number(document.getElementById('bobotPsi').value) || 0;
  const afe = Number(document.getElementById('bobotAfe').value) || 0;
  if (f + s + sas + psi + afe !== 100) {
    showToast('Total persentase bobot harus tepat 100%!', 'error');
    return;
  }
  appData.bobotNilai = { formatif: f, sumatif: s, sas, psikomotor: psi, afektif: afe };
  saveAppData();
  renderApp();
}

function exportPengolahExcel(mapelId) {
  const mapelObj = appData.mapel.find(m => m.id === mapelId);
  const sem = appData.profil.semesterAktif;
  const rows = getSiswaKelasAktif().map((s, idx) => {
    const r = calcNilaiAkhirMapel(s.id, mapelId, sem);
    return {
      No: idx + 1,
      NISN: s.nisn,
      Nama: s.nama,
      Formatif: r.avgFormatif,
      Sumatif: r.avgSumatif,
      SAS: r.sasVal,
      Psikomotor: r.psikomotor,
      Afektif: r.afektif,
      Nilai_Akhir: r.nilaiAkhir
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pengolahan_Nilai');
  XLSX.writeFile(wb, `Nilai_Akhir_${mapelObj?.nama || 'Mapel'}.xlsx`);
}

  const p = appData.profil;

function togglePoinSiswa(id) {
  if (uiState.selectedPoinSiswaIds.has(id)) uiState.selectedPoinSiswaIds.delete(id);
  else uiState.selectedPoinSiswaIds.add(id);
  renderApp();
}

function toggleSelectAllPoinSiswa(selectAll) {
  if (selectAll) {
    getSiswaKelasAktif().forEach(s => uiState.selectedPoinSiswaIds.add(s.id));
  } else {
    uiState.selectedPoinSiswaIds.clear();
  }
  renderApp();
}

function syncPoinNilaiFromKategori() {
  const sel = document.getElementById('poinKategoriSelect');
  const opt = sel.options[sel.selectedIndex];
  if (opt) document.getElementById('poinNilaiInput').value = opt.dataset.poin;
}

function applyPoinToSelected(e) {
  e.preventDefault();
  if (uiState.selectedPoinSiswaIds.size === 0) {
    showToast('Centang minimal 1 siswa terlebih dahulu!', 'error');
    return;
  }
  const kategori = document.getElementById('poinKategoriSelect').value;
  const tanggal = document.getElementById('poinTanggal').value;
  const poinVal = Number(document.getElementById('poinNilaiInput').value);
  const catatan = document.getElementById('poinCatatan').value.trim();

  uiState.selectedPoinSiswaIds.forEach(siswaId => {
    appData.poinLog.unshift({
      id: 'PN-' + Date.now() + '-' + siswaId,
      tanggal,
      siswaId,
      jenis: poinVal >= 0 ? 'Positif' : 'Negatif',
      kategori,
      poin: poinVal,
      catatan
    });
  });

  uiState.selectedPoinSiswaIds.clear();
  saveAppData();
  renderApp();
}

function deletePoinLog(id) {
  appData.poinLog = appData.poinLog.filter(l => l.id !== id);
  saveAppData();
  renderApp();
}

/**
 * ============================================================================
 * 12. LAPORAN HASIL BELAJAR (RAPOR) — SESUAI GAMBAR REFERENSI & TERINTEGRASI TP
 * ============================================================================
 */
function renderRapor() {
  const p = appData.profil;
  const sem = p.semesterAktif;
  const siswaKelas = getSiswaKelasAktif();
  const siswa = siswaKelas.find(s => s.id === uiState.selectedRaporSiswaId) || siswaKelas[0];

  // Rekap kehadiran semester ini

  Object.entries(appData.absensi).forEach(([k, val]) => {
    if (k.endsWith(`|${siswa.id}`)) {
      if (val.status === 'Sakit') sakit++;
      else if (val.status === 'Izin') izin++;
      else if (val.status === 'Alpa') alpa++;
    }

  const ekskulSiswa = appData.nilaiEkskul.filter(e => e.siswaId === siswa.id && e.semester === sem);
  const catatanWali = appData.catatanRapor[`${sem}|${siswa.id}`] || 'Ananda menunjukkan perkembangan belajar dan pembiasaan 7 Kebiasaan Anak Indonesia Hebat dengan baik. Terus tingkatkan semangat belajar!';

          <i data-lucide="printer" class="w-4 h-4"></i> Cetak Rapor Resmi / PDF
        </button>
      </div>

      <!-- LEMBAR RAPOR FORMAT RESMI (SESUAI REFERENSI GAMBAR) -->

            <tr><td class="border-none! p-0.5!">NISN</td><td class="border-none! p-0.5!">:</td><td class="border-none! p-0.5!">${esc(siswa.nisn)}</td></tr>
            <tr><td class="border-none! p-0.5!">Nama Sekolah</td><td class="border-none! p-0.5!">:</td><td class="border-none! p-0.5!">${esc(p.namaSekolah)}</td></tr>

            <tr><td class="border-none! p-0.5!">Semester</td><td class="border-none! p-0.5!">:</td><td class="border-none! p-0.5!">${esc(p.semesterAktif)}</td></tr>

          </table>
        </div>

        <!-- Bagian A: Nilai dan Capaian Kompetensi (Terintegrasi TP Tertinggi & Terendah) -->

              if (calc.tpEvaluations.length > 0) {
                const sorted = [...calc.tpEvaluations].sort((a, b) => b.score - a.score);

          </tbody>
        </table>

        <!-- Bagian C: Ketidakhadiran & Catatan Wali Kelas -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8 page-break-inside-avoid">
          <div>
            <div class="font-bold text-sm mb-2">C. Ketidakhadiran</div>
            <table class="w-full border-collapse border border-black text-xs sm:text-sm">
              <tr><td class="border border-black py-1 px-3">Sakit</td><td class="border border-black py-1 px-3 text-center w-24">${sakit} hari</td></tr>
              <tr><td class="border border-black py-1 px-3">Izin</td><td class="border border-black py-1 px-3 text-center">${izin} hari</td></tr>
              <tr><td class="border border-black py-1 px-3">Tanpa Keterangan (Alpa)</td><td class="border border-black py-1 px-3 text-center">${alpa} hari</td></tr>

        <!-- Lembar Tanda Tangan Resmi -->

          <div>
            <div>Mengetahui,</div>

}

/**
 * ============================================================================
 * 13. PENGATURAN GOOGLE APPS SCRIPT (GAS) & SINKRONISASI
 * ============================================================================
 */
function openGasSettingsModal() {
  const currentUrl = localStorage.getItem(GAS_URL_KEY) || '';
  const gasSampleCode = `function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('AksraEdu_JSON') || ss.insertSheet('AksraEdu_JSON');
  var raw = sheet.getRange('A1').getValue();
  return ContentService.createTextOutput(raw || '{"status":"empty"}')
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('AksraEdu_JSON') || ss.insertSheet('AksraEdu_JSON');
  sheet.getRange('A1').setValue(e.postData.contents);
  sheet.getRange('B1').setValue(new Date());
  return ContentService.createTextOutput(JSON.stringify({status: 'ok'}))
    .setMimeType(ContentService.MimeType.JSON);
}`;

  openModal('Pengaturan Sinkronisasi Google Apps Script', `
    <div class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1">Web App URL Google Apps Script (/exec)</label>
        <input type="url" id="gasUrlInput" value="${esc(currentUrl)}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl" />
      </div>
      <div class="flex gap-2">
        <button onclick="saveGasUrl()" class="flex-1 py-2.5 rounded-xl bg-emerald-700 text-white font-bold hover:bg-emerald-800">Simpan URL & Sinkron</button>
        <button onclick="resetDefaultDemoData()" class="px-3 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200">Reset Data Contoh</button>
      </div>
      <div class="pt-3 border-t border-slate-200">
        <div class="font-bold text-slate-700 mb-1">Kode Backend Apps Script (Code.gs) Siap Salin:</div>
        <pre class="p-3 rounded-xl bg-slate-900 text-emerald-300 text-[11px] overflow-x-auto select-all">${esc(gasSampleCode)}</pre>
      </div>
    </div>
  `);
}

function saveGasUrl() {
  const url = document.getElementById('gasUrlInput').value.trim();
  localStorage.setItem(GAS_URL_KEY, url);
  closeModal();
  syncWithGAS();
}

function resetDefaultDemoData() {
  appData = structuredClone(DEFAULT_DATA);
  saveAppData();
  closeModal();
  renderApp();
}

async function syncWithGAS() {
  const url = localStorage.getItem(GAS_URL_KEY);
  const label = document.getElementById('syncLabel');
  if (!url) {
    if (label) label.textContent = 'Mode Lokal (URL GAS belum diisi)';
    showToast('Data tersimpan aman di Penyimpanan Lokal', 'info');
    return;
  }
  try {
    if (label) label.textContent = 'Menyinkronkan...';
    await fetch(url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(appData)
    });
    if (label) label.textContent = 'Tersinkron ke Cloud GAS';
    showToast('Berhasil mengirim cadangan data ke Google Sheets!', 'success');
  } catch (err) {
    if (label) label.textContent = 'Gagal terhubung (Mode Lokal)';
    showToast('Gagal sinkron: ' + err.message, 'error');
  }
}

/**
 * ============================================================================
 * MAIN ROUTER RENDERER
 * ============================================================================
 */
function renderApp() {
  updateHeaderBadges();
  const container = document.getElementById('appContent');
  if (!container) return;

  switch (uiState.currentPage) {
    case 'beranda': container.innerHTML = renderBeranda(); break;
    case 'profil': container.innerHTML = renderProfil(); break;
    case 'kelas': container.innerHTML = renderKelas(); break;
    case 'absensi': container.innerHTML = renderAbsensi(); break;
    case 'nilai': container.innerHTML = renderNilai(); break;
    case 'pengolah': container.innerHTML = renderPengolah(); break;
    case 'ekskul': container.innerHTML = renderEkskul(); break;
    case 'kokurikuler': container.innerHTML = renderKokurikuler(); break;
    case 'jurnal': container.innerHTML = renderJurnal(); break;
    case 'jadwal': container.innerHTML = renderJadwal(); break;
    case 'poin': container.innerHTML = renderPoin(); break;
    case 'rapor': container.innerHTML = renderRapor(); break;
    default: container.innerHTML = renderBeranda();
  }
  lucide.createIcons();
}

window.addEventListener('DOMContentLoaded', () => {
