    }
    .print-only-block {
      display: none;
    }
    .rapor-sheet,

      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    }

      border-collapse: collapse;
      width: 100%;
    }

      border: 1px solid #94a3b8;
    }
    .sertifikat-frame {

      border-radius: 14px;
      padding: 22px;
      background: linear-gradient(180deg, #ffffff 0%, #ecfdf5 100%);

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }

      aside,
      header,

      #modalContainer {

      }
      #mainShell {
        margin-left: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      #appContent {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .print-only-block {
        display: block !important;
      }
      .rapor-sheet,
      .sertifikat-sheet {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        border-radius: 0 !important;
      }
      .page-break-after {
        page-break-after: always;
        break-after: page;
      }
      .page-break-inside-avoid {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      th, td {
        border: 1px solid #334155 !important;
      }
      table.no-border th,

        border: none !important;

        border: none !important;

    function hitungMasaPengabdian(tglMulai) {
      if (!tglMulai) return '-';
      const start = new Date(tglMulai);
      const now = new Date();
      if (isNaN(start.getTime())) return '-';
      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();
      if (days < 0) {
        months--;
        days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      }
      if (months < 0) {
        years--;
        months += 12;
      }
      return `${Math.max(0, years)} Tahun ${Math.max(0, months)} Bulan ${Math.max(0, days)} Hari`;
    }

    function cleanTpDeskripsi(text) {
      return String(text || '').trim().replace(/\.+$/, '');

    function hitungNilaiMapelSiswa(siswaId, mapelId, semester) {
      const m = appData.mapel.find(x => x.id === mapelId);
      if (!m) return { kognitif: null, psikomotor: null, afektif: null, nilaiAkhir: null, deskripsiBaik: '-', deskripsiPerluBimbingan: '' };

      const key = `${semester}|${mapelId}|${siswaId}`;
      const tpList = m.tp?.[semester] || [];
      const kogRec = appData.nilaiKognitif[key] || { tp: {}, sas: '' };

      const tpScores = [];

      tpList.forEach(tp => {
        const d = kogRec.tp?.[tp.id] || {};
        const vals = [d.form, d.sum].filter(v => v !== '' && v !== undefined && v !== null && !isNaN(Number(v))).map(Number);
        if (vals.length) {
          const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
          tpScores.push({ tp, avg });
        }
      });

      const sasVal = kogRec.sas !== '' && kogRec.sas !== undefined && kogRec.sas !== null && !isNaN(Number(kogRec.sas)) ? Number(kogRec.sas) : null;
      let kognitif = null;
      if (tpScores.length || sasVal !== null) {
        const avgTp = tpScores.length ? tpScores.reduce((a, b) => a + b.avg, 0) / tpScores.length : sasVal;
        kognitif = sasVal !== null ? Math.round((avgTp * 0.7) + (sasVal * 0.3)) : Math.round(avgTp);
      }

      const psiRec = appData.nilaiPsikomotor[key] || {};
      const psiVals = INDIKATOR_PSIKOMOTOR.map(ind => Number(psiRec[ind.key])).filter(v => v >= 1 && v <= 4);
      const psikomotor = psiVals.length ? Math.round((psiVals.reduce((a, b) => a + b, 0) / psiVals.length) * 25) : null;

      const afeRec = appData.nilaiAfektif[key] || {};
      const afeVals = INDIKATOR_AFEKTIF.map(ind => Number(afeRec[ind.key])).filter(v => v >= 1 && v <= 4);
      const afektif = afeVals.length ? Math.round((afeVals.reduce((a, b) => a + b, 0) / afeVals.length) * 25) : null;

      const b = appData.bobotNilai;
      let totalBobot = 0;
      let totalSkor = 0;
      if (kognitif !== null) { totalSkor += kognitif * b.kognitif; totalBobot += b.kognitif; }
      if (psikomotor !== null) { totalSkor += psikomotor * b.psikomotor; totalBobot += b.psikomotor; }
      if (afektif !== null) { totalSkor += afektif * b.afektif; totalBobot += b.afektif; }

      const nilaiAkhir = totalBobot > 0 ? Math.round(totalSkor / totalBobot) : null;

      let deskripsiBaik = 'Ananda menunjukkan pemahaman yang baik dalam mengikuti pembelajaran pada semester ini.';
      let deskripsiPerluBimbingan = '';

      if (tpScores.length > 0) {
        const maxAvg = Math.max(...tpScores.map(item => item.avg));
        const minAvg = Math.min(...tpScores.map(item => item.avg));

        const tpTertinggi = tpScores
          .filter(item => Math.abs(item.avg - maxAvg) < 0.0001)
          .map(item => cleanTpDeskripsi(item.tp.deskripsi));

        deskripsiBaik = `Ananda menunjukkan pemahaman sangat baik dalam ${tpTertinggi.join('; ')}.`;

        if (minAvg < 100) {
          const tpTerendah = tpScores
            .filter(item => Math.abs(item.avg - minAvg) < 0.0001)
            .map(item => cleanTpDeskripsi(item.tp.deskripsi));
          deskripsiPerluBimbingan = `Ananda perlu bimbingan dalam ${tpTerendah.join('; ')}.`;
        } else {
          deskripsiPerluBimbingan = '';
        }
      }

      return { kognitif, psikomotor, afektif, nilaiAkhir, deskripsiBaik, deskripsiPerluBimbingan };
    }

    function hitungLegerKelas(sem) {
      const records = appData.siswa.map(s => {
        const nilaiPerMapel = {};
        let totalNilai = 0;
        let jumlahMapelDinilai = 0;

        appData.mapel.forEach(m => {
          const h = hitungNilaiMapelSiswa(s.id, m.id, sem);
          nilaiPerMapel[m.id] = h.nilaiAkhir;
          if (h.nilaiAkhir !== null && h.nilaiAkhir !== undefined) {
            totalNilai += h.nilaiAkhir;
            jumlahMapelDinilai++;
          }
        });

        const rataRata = jumlahMapelDinilai > 0 ? Number((totalNilai / jumlahMapelDinilai).toFixed(2)) : null;
        return {
          siswa: s,
          nilaiPerMapel,
          totalNilai: jumlahMapelDinilai > 0 ? totalNilai : null,
          jumlahMapelDinilai,
          rataRata,
          peringkat: null
        };
      });

      const rankedList = records
        .filter(r => r.totalNilai !== null)
        .sort((a, b) => {
          if (b.totalNilai !== a.totalNilai) return b.totalNilai - a.totalNilai;
          return (b.rataRata || 0) - (a.rataRata || 0);
        });

      let currentRank = 0;
      let prevTotal = null;
      rankedList.forEach((item, idx) => {
        if (prevTotal === null || item.totalNilai < prevTotal) {
          currentRank = idx + 1;
          prevTotal = item.totalNilai;
        }
        item.peringkat = currentRank;
      });

      const bySiswaId = {};
      records.forEach(r => { bySiswaId[r.siswa.id] = r; });
      return { records, bySiswaId };
    }

    function hitung7KaihSiswa(siswaId, semester) {
      const rec = appData.nilai7Kaih[`${semester}|${siswaId}`] || {};
      const vals = INDIKATOR_7KAIH.map(ind => Number(rec[ind.key])).filter(v => v >= 1 && v <= 4);
      const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
      const rata = vals.length ? avg.toFixed(2) : '0.00';
      let predikat = 'Belum Dinilai';
      if (vals.length) {
        if (avg >= 3.5) predikat = 'Sangat Membudaya (A)';
        else if (avg >= 2.75) predikat = 'Membudaya Baik (B)';
        else if (avg >= 2.0) predikat = 'Mulai Berkembang (C)';
        else predikat = 'Perlu Pembiasaan (D)';
      }
      return { rec, rata, predikat };
    }

    function renderTabelSkala14(students, mapel, sem, tipe, indikatorList) {

      }

      return `

          <table class="w-full text-xs text-left">

              <tr>
                <th class="px-3 py-3 text-center w-10">No</th>
                <th class="px-3 py-3 min-w-[170px]">Nama Peserta Didik</th>
                ${indikatorList.map(ind => `<th class="px-2 py-3 text-center min-w-[95px]">${esc(ind.label)}</th>`).join('')}

    function updateNilaiKognitif(siswaId, tpId, jenis, val) {
      const key = `${appData.profil.semesterAktif}|${uiState.selectedMapelId}|${siswaId}`;
      if (!appData.nilaiKognitif[key]) appData.nilaiKognitif[key] = { tp: {}, sas: '' };
      if (!appData.nilaiKognitif[key].tp[tpId]) appData.nilaiKognitif[key].tp[tpId] = {};
      appData.nilaiKognitif[key].tp[tpId][jenis] = val === '' ? '' : Number(val);
      saveAppData(true);
    }

    function updateNilaiSas(siswaId, val) {
      const key = `${appData.profil.semesterAktif}|${uiState.selectedMapelId}|${siswaId}`;
      if (!appData.nilaiKognitif[key]) appData.nilaiKognitif[key] = { tp: {}, sas: '' };
      appData.nilaiKognitif[key].sas = val === '' ? '' : Number(val);
      saveAppData(true);
    }

    function updateNilaiSkala14(tipe, siswaId, indKey, val) {
      const sem = appData.profil.semesterAktif;
      const mapelId = uiState.selectedMapelId;
      const key = `${sem}|${mapelId}|${siswaId}`;
      const store = tipe === 'psikomotor' ? appData.nilaiPsikomotor : appData.nilaiAfektif;
      if (!store[key]) store[key] = {};
      store[key][indKey] = val === '' ? '' : Number(val);
      saveAppData(true);
      const cell = document.getElementById(`konv_${tipe}_${siswaId}`);
      if (cell) {
        const h = hitungNilaiMapelSiswa(siswaId, mapelId, sem);
        const konv = tipe === 'psikomotor' ? h.psikomotor : h.afektif;
        cell.textContent = konv ?? '-';
      }
    }

    function downloadTemplateNilaiExcel() {
      const sem = appData.profil.semesterAktif;
      const mapel = appData.mapel.find(m => m.id === uiState.selectedMapelId);
      if (!mapel) return;
      const tpList = mapel.tp?.[sem] || [];
      const rows = appData.siswa.map((s, i) => {
        const row = { No: i + 1, NISN: s.nisn, Nama: s.nama };
        if (uiState.nilaiSubTab === 'kognitif') {
          tpList.forEach(tp => { row[`${tp.kode} Form`] = 85; row[`${tp.kode} Sum`] = 85; });
          row.SAS = 85;
        } else if (uiState.nilaiSubTab === 'psikomotor') {
          INDIKATOR_PSIKOMOTOR.forEach(ind => { row[ind.label] = 4; });
        } else {
          INDIKATOR_AFEKTIF.forEach(ind => { row[ind.label] = 4; });
        }
        return row;
      });
      exportTableToExcel(`Template_${uiState.nilaiSubTab}_${mapel.nama}`, rows);
    }

    function importNilaiFromExcel(event) {
      const file = event.target.files?.[0];
      if (!file || !window.XLSX) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
          const sem = appData.profil.semesterAktif;
          const mapel = appData.mapel.find(m => m.id === uiState.selectedMapelId);
          const tpList = mapel?.tp?.[sem] || [];
          let count = 0;

          rows.forEach(row => {
            const nisn = String(row.NISN ?? '').trim();
            const nama = String(row.Nama ?? '').trim().toLowerCase();
            const siswa = appData.siswa.find(s => (nisn && s.nisn === nisn) || (nama && s.nama.toLowerCase() === nama));
            if (!siswa || !mapel) return;
            const key = `${sem}|${mapel.id}|${siswa.id}`;

            if (uiState.nilaiSubTab === 'kognitif') {
              if (!appData.nilaiKognitif[key]) appData.nilaiKognitif[key] = { tp: {}, sas: '' };
              tpList.forEach(tp => {
                if (!appData.nilaiKognitif[key].tp[tp.id]) appData.nilaiKognitif[key].tp[tp.id] = {};
                if (row[`${tp.kode} Form`] !== '') appData.nilaiKognitif[key].tp[tp.id].form = Number(row[`${tp.kode} Form`]);
                if (row[`${tp.kode} Sum`] !== '') appData.nilaiKognitif[key].tp[tp.id].sum = Number(row[`${tp.kode} Sum`]);
              });
              if (row.SAS !== '') appData.nilaiKognitif[key].sas = Number(row.SAS);
            } else if (uiState.nilaiSubTab === 'psikomotor') {
              if (!appData.nilaiPsikomotor[key]) appData.nilaiPsikomotor[key] = {};
              INDIKATOR_PSIKOMOTOR.forEach(ind => {
                const v = Number(row[ind.label]);
                if (v >= 1 && v <= 4) appData.nilaiPsikomotor[key][ind.key] = v;
              });
            } else {
              if (!appData.nilaiAfektif[key]) appData.nilaiAfektif[key] = {};
              INDIKATOR_AFEKTIF.forEach(ind => {
                const v = Number(row[ind.label]);
                if (v >= 1 && v <= 4) appData.nilaiAfektif[key][ind.key] = v;
              });
            }
            count++;
          });

          saveAppData();
          renderApp();
          showToast(`Import Excel nilai berhasil untuk ${count} siswa.`);
        } catch (err) {
          showToast('Gagal mengimpor file Excel nilai.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function getRekapPengolahanMapel(mapelId, sem) {
      const rankMap = {};
      const allScores = appData.siswa
        .map(s => ({ id: s.id, nilaiAkhir: hitungNilaiMapelSiswa(s.id, mapelId, sem).nilaiAkhir }))
        .filter(x => x.nilaiAkhir !== null && x.nilaiAkhir !== undefined)
        .sort((a, b) => b.nilaiAkhir - a.nilaiAkhir);

      let currentRank = 0;
      let prevScore = null;
      allScores.forEach((item, index) => {
        if (prevScore === null || item.nilaiAkhir < prevScore) {
          currentRank = index + 1;
          prevScore = item.nilaiAkhir;
        }
        rankMap[item.id] = currentRank;
      });
      return rankMap;
    }

    function exportNilaiExcel() {
      const sem = appData.profil.semesterAktif;
      const mapel = appData.mapel.find(m => m.id === uiState.selectedMapelId);
      if (!mapel) return;
      const rankMap = getRekapPengolahanMapel(mapel.id, sem);
      const list = uiState.pengolahanSortMode === 'ranking'
        ? [...appData.siswa].sort((a, b) => (rankMap[a.id] ?? 9999) - (rankMap[b.id] ?? 9999))
        : appData.siswa;

      const rows = list.map((s, i) => {
        const h = hitungNilaiMapelSiswa(s.id, mapel.id, sem);
        return {
          No: i + 1,
          Peringkat: rankMap[s.id] ?? '-',
          NISN: s.nisn,
          Nama: s.nama,
          Kognitif: h.kognitif ?? '',
          Psikomotor: h.psikomotor ?? '',
          Afektif: h.afektif ?? '',
          Nilai_Akhir: h.nilaiAkhir ?? '',
          Deskripsi_Capaian: [h.deskripsiBaik, h.deskripsiPerluBimbingan].filter(Boolean).join(' ')
        };
      });
      exportTableToExcel(`Rekap_Nilai_${mapel.nama}_${sem}`, rows);
    }

    function exportLegerExcel() {
      const sem = appData.profil.semesterAktif;
      const leger = hitungLegerKelas(sem);
      const baseList = uiState.legerSortMode === 'ranking'
        ? [...appData.siswa].sort((a, b) => (leger.bySiswaId[a.id]?.peringkat ?? 9999) - (leger.bySiswaId[b.id]?.peringkat ?? 9999))

      const rows = baseList.map((s, idx) => {
        const rec = leger.bySiswaId[s.id] || { nilaiPerMapel: {}, totalNilai: null, rataRata: null, peringkat: null };
        const row = {
          No: idx + 1,
          NISN: s.nisn,
          Nama_Peserta_Didik: s.nama

        appData.mapel.forEach(m => {
          row[m.nama] = rec.nilaiPerMapel[m.id] ?? '';

        row.Total_Nilai_Rapor = rec.totalNilai ?? '';
        row.Rata_Rata = rec.rataRata ?? '';
        row.Peringkat_Kelas = rec.peringkat ?? '-';
        return row;
      });
      exportTableToExcel(`Leger_Peringkat_Kelas_${appData.profil.kelasAktif}_${sem}`, rows);
    }

    function getRekapAbsensiSiswaSemester(siswaId, semester) {
      let sakit = 0, izin = 0, alpha = 0;
      const prefix = `${semester}|`;
      Object.entries(appData.absensi).forEach(([k, val]) => {
        if (k.startsWith(prefix) && k.endsWith(`|${siswaId}`)) {
          if (val === 'S') sakit++;
          else if (val === 'I') izin++;
          else if (val === 'A') alpha++;
        }
      });
      return { sakit, izin, alpha };
    }

    function renderBeranda() {
      const p = appData.profil;
      const sem = p.semesterAktif;
      const todayStr = getTodayLocalStr();
      const tglHariIni = uiState.absensiTanggal;
      let hadirCount = 0;
      appData.siswa.forEach(s => {
        const st = appData.absensi[`${sem}|${tglHariIni}|${s.id}`] || 'H';
        if (st === 'H') hadirCount++;
      });

      const yr = uiState.kalenderTahun;
      const mo = uiState.kalenderBulan;
      const namaBulan = new Date(yr, mo, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
      const firstDay = new Date(yr, mo, 1).getDay();
      const offset = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(yr, mo + 1, 0).getDate();
      const agendaTerpilih = appData.kalenderAgenda.filter(a => a.tanggal === uiState.kalenderSelectedDate);

      const selDateObj = new Date(`${uiState.kalenderSelectedDate}T00:00:00`);
      const namaHariTerpilih = !isNaN(selDateObj.getTime())
        ? selDateObj.toLocaleDateString('id-ID', { weekday: 'long' })
        : '';
      const tglTerpilihFormatted = !isNaN(selDateObj.getTime())
        ? selDateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
        : uiState.kalenderSelectedDate;

      let selHadir = 0, selSakit = 0, selIzin = 0, selAlpa = 0;
      appData.siswa.forEach(s => {
        const st = appData.absensi[`${sem}|${uiState.kalenderSelectedDate}|${s.id}`] || 'H';
        if (st === 'S') selSakit++;
        else if (st === 'I') selIzin++;
        else if (st === 'A') selAlpa++;
        else selHadir++;
      });

      const jadwalHariTerpilih = appData.jadwalPelajaran.filter(
        j => (j.hari || '').toLowerCase() === namaHariTerpilih.toLowerCase()
      );

      let cells = '';
      for (let i = 0; i < offset; i++) {
        cells += `<div class="h-16 rounded-xl bg-slate-50 border border-slate-100"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${yr}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const ag = appData.kalenderAgenda.filter(a => a.tanggal === dateStr);
        const isSelected = uiState.kalenderSelectedDate === dateStr;
        const isToday = dateStr === todayStr;
        const isSunday = ((offset + d - 1) % 7) === 6;

        let cellClass = 'border-slate-200 bg-white hover:bg-slate-50';

          cellClass = 'border-emerald-700 bg-emerald-50 ring-2 ring-emerald-600';

        } else if (isToday) {
          cellClass = 'border-emerald-500 bg-emerald-50/40 ring-1 ring-emerald-400';
        }

        cells += `
          <div onclick="uiState.kalenderSelectedDate='${dateStr}'; uiState.absensiTanggal='${dateStr}'; renderApp();"
            ondblclick="uiState.kalenderSelectedDate='${dateStr}'; openTambahAgendaModal();"
            title="Klik untuk melihat detail tanggal • Double-klik untuk tambah agenda"

              <span class="text-xs font-extrabold ${isToday ? 'px-1.5 py-0.5 rounded-md bg-emerald-700 text-white' : (isSunday ? 'text-rose-600' : 'text-slate-800')}">${d}</span>
              ${isToday ? `<span class="text-[8px] font-extrabold uppercase tracking-tight px-1 py-0.5 rounded bg-emerald-100 text-emerald-800">Hari Ini</span>` : (ag.length ? `<span class="w-2 h-2 rounded-full bg-emerald-600"></span>` : '')}

      return `

            <div class="space-y-1.5">

    function uploadLogoFile(event, key) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        appData.logos[key] = e.target.result;
        saveAppData();
        renderApp();
      };
      reader.readAsDataURL(file);
    }

    function importSiswaFromExcel(event) {
      const file = event.target.files?.[0];
      if (!file || !window.XLSX) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
          let added = 0;
          rows.forEach((r, i) => {
            const nama = String(r.Nama || r['Nama Lengkap'] || r['Nama Peserta Didik'] || '').trim();
            if (!nama) return;
            const nis = String(r.NIS || '').trim();
            const nisn = String(r.NISN || '').trim();
            const jkRaw = String(r.JK || r['L/P'] || 'L').trim().toUpperCase();
            const jk = jkRaw.startsWith('P') ? 'P' : 'L';
            const existing = appData.siswa.find(s => (nisn && s.nisn === nisn) || s.nama.toLowerCase() === nama.toLowerCase());
            if (existing) {
              if (nis) existing.nis = nis;
              if (nisn) existing.nisn = nisn;
              existing.jk = jk;
            } else {
              appData.siswa.push({ id: `SIS-${Date.now()}-${i}`, nis, nisn, nama, jk, kelas: appData.profil.kelasAktif });
            }
            added++;
          });
          saveAppData();
          renderApp();
          showToast(`Berhasil mengimpor ${added} data peserta didik.`);
        } catch (err) {
          showToast('Gagal membaca file Excel siswa.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function getKokurikulerSemester(sem) {
      if (!appData.kokurikuler[sem]) {
        appData.kokurikuler[sem] = { tema: 'Proyek Kokurikuler', tujuan: '', kegiatan: [], skor: {} };
      }
      return appData.kokurikuler[sem];
    }

    function generateDeskripsiKokurikuler(siswaId, sem) {
      const koku = getKokurikulerSemester(sem);
      const skorArr = koku.skor?.[siswaId] || [];
      const baik = [];
      const perlu = [];
      koku.kegiatan.forEach((keg, idx) => {
        const v = Number(skorArr[idx]);
        if (v >= 3) baik.push(keg);
        else if (v >= 1) perlu.push(keg);
      });
      if (!baik.length && !perlu.length) return '';
      let text = `Dalam proyek tema "${koku.tema}"`;
      if (baik.length) text += `, ananda nampak baik aktivitas ${baik.join(', ')}.`;
      if (perlu.length) text += ` Namun masih perlu bimbingan dalam ${perlu.join(', ')}.`;
      return text;
    }

    function import7KaihFromExcel(event) {
      const file = event.target.files?.[0];
      if (!file || !window.XLSX) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
          const sem = appData.profil.semesterAktif;
          let count = 0;
          rows.forEach(row => {
            const nisn = String(row.NISN ?? '').trim();
            const nama = String(row.Nama ?? '').trim().toLowerCase();
            const siswa = appData.siswa.find(s => (nisn && s.nisn === nisn) || (nama && s.nama.toLowerCase() === nama));
            if (!siswa) return;
            const key = `${sem}|${siswa.id}`;
            if (!appData.nilai7Kaih[key]) appData.nilai7Kaih[key] = {};
            INDIKATOR_7KAIH.forEach(ind => {
              const v = Number(row[ind.label]);
              if (v >= 1 && v <= 4) appData.nilai7Kaih[key][ind.key] = v;
            });
            count++;
          });
          saveAppData();
          renderApp();
          showToast(`Berhasil mengimpor nilai 7KAIH untuk ${count} siswa.`);
        } catch (err) {
          showToast('Gagal mengimpor file Excel 7KAIH.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function export7KaihExcel() {
      const sem = appData.profil.semesterAktif;
      const rows = appData.siswa.map((s, i) => {
        const h = hitung7KaihSiswa(s.id, sem);
        const r = { No: i + 1, NISN: s.nisn, Nama: s.nama };
        INDIKATOR_7KAIH.forEach(ind => { r[ind.label] = h.rec[ind.key] || ''; });
        r.Rata_Rata = h.rata;
        r.Predikat = h.predikat;
        return r;
      });
      exportTableToExcel(`Rekap_7KAIH_${sem}`, rows);
    }

    function renderRapor() {
      const p = appData.profil;
      const students = getFilteredStudents();
      if (!students.some(s => s.id === uiState.selectedRaporSiswaId) && students.length) {
        uiState.selectedRaporSiswaId = students[0].id;
      }
      const selectedStudent = students.find(s => s.id === uiState.selectedRaporSiswaId) || appData.siswa[0];

      const sheetsHtml = uiState.printAllRaporMode
        ? appData.siswa.map((s, i) => renderSingleRaporSheet(s, i === appData.siswa.length - 1)).join('')
        : (selectedStudent ? renderSingleRaporSheet(selectedStudent, true) : '');

      return `
        <div class="space-y-5">
          <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-3 no-print">
            <div class="flex flex-wrap items-center gap-2.5">
              <label class="text-xs font-bold text-slate-700">Peserta Didik:</label>
              <select onchange="uiState.selectedRaporSiswaId = this.value; uiState.printAllRaporMode = false; renderApp();" class="px-3 py-2 text-xs font-bold border border-emerald-300 rounded-xl bg-emerald-50 text-emerald-950">
                ${appData.siswa.map((s, i) => `<option value="${s.id}" ${s.id === selectedStudent?.id ? 'selected' : ''}>${i + 1}. ${esc(s.nama)} (NISN: ${esc(s.nisn)})</option>`).join('')}
              </select>
              <div class="flex items-center gap-1.5 pl-2 border-l border-slate-200">
                <span class="text-[11px] font-bold text-slate-600">ID TTD:</span>
                <select onchange="appData.profil.jenisIdGuru = this.value; saveAppData(true); renderApp();" class="px-2.5 py-1.5 text-xs font-bold border border-slate-300 rounded-xl bg-white" title="Identitas Wali Kelas">
                  <option value="NIP" ${(p.jenisIdGuru || 'NIP') === 'NIP' ? 'selected' : ''}>Guru: NIP</option>
                  <option value="NUPTK" ${p.jenisIdGuru === 'NUPTK' ? 'selected' : ''}>Guru: NUPTK</option>
                </select>
                <select onchange="appData.profil.jenisIdKepsek = this.value; saveAppData(true); renderApp();" class="px-2.5 py-1.5 text-xs font-bold border border-slate-300 rounded-xl bg-white" title="Identitas Kepala Sekolah">
                  <option value="NIP" ${(p.jenisIdKepsek || 'NIP') === 'NIP' ? 'selected' : ''}>Kepsek: NIP</option>
                  <option value="NUPTK" ${p.jenisIdKepsek === 'NUPTK' ? 'selected' : ''}>Kepsek: NUPTK</option>
                </select>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="downloadRaporWord()" class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-800 text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="file-text" class="w-4 h-4 text-sky-700"></i> Download Word
              </button>
              <button type="button" onclick="printSingleRapor()" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="printer" class="w-4 h-4"></i> Cetak Rapor Siswa Ini
              </button>
              <button type="button" onclick="printAllRapor()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="files" class="w-4 h-4"></i> Cetak Semua (${appData.siswa.length})
              </button>
            </div>
          </div>

          <div id="raporPrintableWrapper">
            ${sheetsHtml}
          </div>
        </div>
      `;
    }

    function updateCatatanRapor(siswaId, val) {
      appData.catatanRapor[`${appData.profil.semesterAktif}|${siswaId}`] = val;
      saveAppData(true);
    }

    function printSingleRapor() {
      uiState.printAllRaporMode = false;
      renderApp();
      setTimeout(() => window.print(), 200);
    }

    function printAllRapor() {
      uiState.printAllRaporMode = true;
      renderApp();
      setTimeout(() => window.print(), 250);
    }

    function downloadRaporWord() {
      const wrapper = document.getElementById('raporPrintableWrapper');
      const siswa = appData.siswa.find(s => s.id === uiState.selectedRaporSiswaId);
      if (!wrapper) return;
      exportHtmlToWord(`Rapor_${siswa?.nama || 'Siswa'}_${appData.profil.semesterAktif}`, wrapper.innerHTML);
    }

    // ========================================================================
    // 10. MODAL PENGATURAN URL, MULTI-DEVICE AUTO-LOAD & SAVE DATA KE GAS
    // ========================================================================
    function closeModal() {
      const modal = document.getElementById('modalContainer');
      if (modal) modal.innerHTML = '';
    }

    function buildShareDeviceLink() {
      const url = (appData.gasUrl || '').trim();
      if (!url) return '';
      const base = window.location.href.split('?')[0];
      return `${base}?gas=${encodeURIComponent(url)}`;
    }

    function copyShareDeviceLink() {
      const link = buildShareDeviceLink();
      if (!link) {
        showToast('Simpan URL GAS terlebih dahulu.', 'warning');
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(() => showToast('Tautan lintas perangkat berhasil disalin!'));
      } else {
        showToast('Salin tautan dari kotak tautan lintas perangkat.', 'warning');
      }
    }

    function openGasModal() {
      const modal = document.getElementById('modalContainer');
      const shareLink = buildShareDeviceLink();
      modal.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
            <div class="flex items-center justify-between">
              <h3 class="font-heading font-extrabold text-base text-slate-900">Pengaturan URL &amp; Penyimpanan Cloud</h3>
              <button type="button" onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <p class="text-xs text-slate-600">Masukkan URL Web App Google Apps Script. Perubahan dicatat secara lokal secara instan agar ringan tanpa lag, lalu klik <strong>Save Data</strong> kapan saja untuk menyimpan ke Google Spreadsheet.</p>
            <input type="url" id="inputGasUrl" value="${esc(appData.gasUrl)}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl" />
            <label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
              <input type="checkbox" id="inputAutoSync" ${appData.autoSync === true ? 'checked' : ''} class="rounded text-emerald-600" />
              <span>Aktifkan auto-sync ke server (opsional — matikan agar bebas lag saat input catatan/nilai)</span>
            </label>
            ${shareLink ? `
              <div class="p-3 rounded-xl border border-emerald-200 bg-emerald-50/70 space-y-1.5">
                <div class="text-[11px] font-bold text-emerald-900">Tautan Cepat Perangkat Lain (HP / Laptop):</div>
                <div class="flex gap-1.5">
                  <input type="text" readonly value="${esc(shareLink)}" class="flex-1 px-2.5 py-1.5 text-[11px] bg-white border border-emerald-300 rounded-lg text-slate-700" />
                  <button type="button" onclick="copyShareDeviceLink()" class="px-2.5 py-1.5 rounded-lg bg-emerald-700 text-white text-[11px] font-bold shrink-0">Salin</button>
                </div>
              </div>
            ` : ''}
            <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
              <button type="button" onclick="saveGasSettingsAndLoad()" class="px-3.5 py-2 rounded-xl border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 text-xs font-bold">Muat Data Terakhir</button>
              <div class="flex gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold">Batal</button>
                <button type="button" onclick="saveGasSettingsOnly()" class="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">Simpan URL</button>
              </div>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function applyGasModalInputs() {
      const urlEl = document.getElementById('inputGasUrl');
      const autoEl = document.getElementById('inputAutoSync');
      if (urlEl) appData.gasUrl = urlEl.value.trim();
      if (autoEl) appData.autoSync = autoEl.checked;
      if (appData.gasUrl) {
        localStorage.setItem(GAS_URL_KEY, appData.gasUrl);
      } else {
        localStorage.removeItem(GAS_URL_KEY);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function saveGasSettingsOnly() {
      applyGasModalInputs();
      closeModal();
      renderApp();
      showToast('URL Google Apps Script disimpan.');
      if (appData.gasUrl) loadFromGas(true);
    }

    function saveGasSettingsAndLoad() {
      applyGasModalInputs();
      loadFromGas(false);
    }

    async function loadFromGas(silent = false) {
      const targetUrl = (appData.gasUrl || '').trim();
      if (!targetUrl) {
        if (!silent) {
          openGasModal();
          showToast('Isi URL Google Apps Script terlebih dahulu.', 'warning');
        }
        return;
      }

      try {
        updateSyncIndicator('loading');
        if (!silent) showToast('Mengambil data terakhir dari Spreadsheet...');
        const sep = targetUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${targetUrl}${sep}action=load&t=${Date.now()}`);
        const json = await res.json();

        if (json.status === 'success' && json.payload) {
          const remote = json.payload;
          const localUpdatedAt = Number(appData.updatedAt) || 0;
          const remoteUpdatedAt = Number(remote.updatedAt) || 0;

          if (silent && localUpdatedAt > 0 && remoteUpdatedAt > 0 && localUpdatedAt > remoteUpdatedAt && localStorage.getItem(STORAGE_KEY)) {
            uiState.hasUnsavedCloudChanges = true;
            updateSyncIndicator('unsaved_cloud');
            return;
          }

          const mergedLogos = {
            logoDinas: appData.logos?.logoDinas || '',
            logoSekolah: appData.logos?.logoSekolah || '',
            ...(remote.logos || {})
          };
          if (!mergedLogos.logoDinas && appData.logos?.logoDinas) mergedLogos.logoDinas = appData.logos.logoDinas;
          if (!mergedLogos.logoSekolah && appData.logos?.logoSekolah) mergedLogos.logoSekolah = appData.logos.logoSekolah;

          const prevAutoSync = appData.autoSync === true;
          appData = normalizeLoadedData(remote, targetUrl);
          appData.autoSync = prevAutoSync;
          appData.logos = mergedLogos;

          const now = new Date();
          appData.lastSyncTime = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
          localStorage.setItem(GAS_URL_KEY, targetUrl);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));

          if (!appData.siswa.some(s => s.id === uiState.selectedRaporSiswaId) && appData.siswa.length) {
            uiState.selectedRaporSiswaId = appData.siswa[0].id;
          }
          if (!appData.siswa.some(s => s.id === uiState.selected7KaihSiswaId) && appData.siswa.length) {
            uiState.selected7KaihSiswaId = appData.siswa[0].id;
          }
          if (!appData.mapel.some(m => m.id === uiState.selectedMapelId) && appData.mapel.length) {
            uiState.selectedMapelId = appData.mapel[0].id;
          }

          uiState.hasUnsavedCloudChanges = false;
          updateSyncIndicator('synced');
          renderApp();
          if (!silent) {
            closeModal();
            showToast('Data terakhir berhasil dimuat dari Spreadsheet!');
          }
        } else {
          updateSyncIndicator(uiState.hasUnsavedCloudChanges ? 'unsaved_cloud' : 'local_saved');
          if (!silent) {
            showToast(json.message || 'Belum ada data cadangan di Spreadsheet.', 'warning');
          }
        }
      } catch (err) {
        updateSyncIndicator('offline', 'Mode Lokal');
        if (!silent) showToast('Gagal memuat data dari Google Apps Script.', 'error');
      }
    }

    async function syncToGas(silent = false) {
      if (uiState.isSyncingNow) return;
      if (!appData.gasUrl) {
        if (!silent) {
          openGasModal();
          showToast('Isi URL Google Apps Script terlebih dahulu.', 'warning');
        }
        return;
      }

      uiState.isSyncingNow = true;
      try {
        updateSyncIndicator('syncing');
        if (!silent) showToast('Menyimpan data ke Google Spreadsheet...');
        appData.updatedAt = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));

        const payload = { ...appData, logos: { logoDinas: '', logoSekolah: '' } };
        const res = await fetch(appData.gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'sync', payload })
        });
        const json = await res.json();
        if (json.status === 'success') {
          const now = new Date();
          appData.lastSyncTime = `${String(now.getHours()).padStart(2, '0')}.${String(now.getMinutes()).padStart(2, '0')}`;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
          uiState.hasUnsavedCloudChanges = false;
          updateSyncIndicator('synced');
          if (!silent) showToast('Save Data berhasil! Seluruh data tersimpan di Spreadsheet.');
        } else {
          updateSyncIndicator('offline', 'Gagal Save Data');
          if (!silent) showToast(json.message || 'Gagal menyimpan ke server.', 'error');
        }
      } catch (err) {
        updateSyncIndicator('offline', 'Gagal Terhubung');
        if (!silent) showToast('Gagal terhubung ke URL Google Apps Script.', 'error');
      } finally {
        uiState.isSyncingNow = false;
        updateSyncIndicator(uiState.hasUnsavedCloudChanges ? 'unsaved_cloud' : uiState.syncState);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setPrintOrientation(appData.printOrientation || 'portrait');
      renderApp();
      if ((appData.gasUrl || '').trim()) {
        loadFromGas(true);
      }
    });
  </script>
