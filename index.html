    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      const colorClass = type === 'error'
        ? 'bg-rose-600 text-white'
        : type === 'warning'
          ? 'bg-amber-600 text-white'
          : 'bg-slate-900 text-white border border-emerald-500/40';
      el.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 transition-all ${colorClass}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
      }, 2800);
    }

    function hitungMasaKerja(tglMulaiStr) {
      if (!tglMulaiStr) return '4 Tahun 4 Bulan 22 Hari';
      const start = new Date(tglMulaiStr);
      const now = new Date();
      if (isNaN(start.getTime()) || start > now) return '0 Tahun 0 Bulan 0 Hari';

      let years = now.getFullYear() - start.getFullYear();
      let months = now.getMonth() - start.getMonth();
      let days = now.getDate() - start.getDate();

      if (days < 0) {
        months -= 1;
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      return `${years} Tahun ${months} Bulan ${days} Hari`;
    }

          bobotNilai: { ...DEFAULT_DATA.bobotNilai, ...(parsed.bobotNilai || {}) },

          nilaiAfektif: parsed.nilaiAfektif && typeof parsed.nilaiAfektif === 'object' ? parsed.nilaiAfektif : structuredClone(DEFAULT_DATA.nilaiAfektif),
          nilaiKokurikuler: parsed.nilaiKokurikuler && typeof parsed.nilaiKokurikuler === 'object' ? parsed.nilaiKokurikuler : structuredClone(DEFAULT_DATA.nilaiKokurikuler),
          jenisEkskul: Array.isArray(parsed.jenisEkskul) && parsed.jenisEkskul.length ? parsed.jenisEkskul : structuredClone(DEFAULT_DATA.jenisEkskul),

    function exportBackupJson() {
      try {
        const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Backup_AksraEduAdm_${appData.profil.tahunAjaran.replace('/', '-')}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('File Backup JSON berhasil diunduh.');
      } catch (err) {
        showToast('Gagal mengekspor JSON.', 'error');
      }
    }

    function importBackupJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported || typeof imported !== 'object' || !imported.profil) {
            throw new Error('Struktur JSON tidak sesuai.');
          }
          appData = { ...structuredClone(DEFAULT_DATA), ...imported };
          saveAppData(true);
          renderApp();
          showToast('Data Backup JSON berhasil dipulihkan!');
        } catch (err) {
          showToast('File JSON tidak valid atau rusak.', 'error');
        }
      };
      reader.readAsText(file);
    }

    async function syncToGas() {
      saveAppData(true);
      if (!appData.gasUrl) {
        showToast('Data tersimpan aman secara lokal (URL Cloud GAS belum diisi).');
        return;
      }
      try {
        showToast('Menyinkronkan data ke Cloud GAS...', 'warning');
        await fetch(appData.gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'sync', payload: appData })
        });
        appData.lastSync = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        saveAppData(true);
        showToast('Sinkronisasi ke Cloud GAS selesai!');
      } catch (err) {
        showToast('Gagal terhubung ke URL GAS. Data tetap tersimpan lokal.', 'error');
      }
    }

    function getPredikat(nilai) {
      const n = Number(nilai) || 0;
      if (n >= 90) return 'A (Sangat Baik)';
      if (n >= 80) return 'B (Baik)';
      if (n >= 75) return 'C (Cukup)';
      return 'D (Perlu Bimbingan)';
    }

    function hitungKomponenNilaiSiswa(siswaId, mapelId, semester) {
      const key = `${semester}|${mapelId}|${siswaId}`;
      const kog = appData.nilaiKognitif[key] || { tpScores: {}, sas: '' };
      const tps = getTPsForMapelSemester(mapelId, semester);

      let sumF = 0, cntF = 0;
      let sumS = 0, cntS = 0;
      tps.forEach(tp => {
        const sc = kog.tpScores?.[tp.id] || {};
        if (sc.formatif !== '' && sc.formatif !== undefined && !isNaN(Number(sc.formatif))) {
          sumF += Number(sc.formatif);
          cntF++;
        }
        if (sc.sumatif !== '' && sc.sumatif !== undefined && !isNaN(Number(sc.sumatif))) {
          sumS += Number(sc.sumatif);
          cntS++;
        }
      });

      const avgFormatif = cntF ? sumF / cntF : 0;
      const avgSumatif = cntS ? sumS / cntS : 0;
      const sas = (kog.sas !== '' && kog.sas !== undefined && !isNaN(Number(kog.sas))) ? Number(kog.sas) : 0;

      const psiObj = appData.nilaiPsikomotor[key] || {};
      const psiVals = KEBIASAAN_7.map(k => psiObj[k.id]).filter(v => v !== '' && v !== undefined && !isNaN(Number(v))).map(Number);
      const avgPsikomotor = psiVals.length ? psiVals.reduce((a, b) => a + b, 0) / psiVals.length : 0;

      const afeObj = appData.nilaiAfektif[key] || {};
      const afeVals = KEBIASAAN_7.map(k => afeObj[k.id]).filter(v => v !== '' && v !== undefined && !isNaN(Number(v))).map(Number);
      const avgAfektif = afeVals.length ? afeVals.reduce((a, b) => a + b, 0) / afeVals.length : 0;

      const b = appData.bobotNilai;
      const totalBobot = (Number(b.formatif) || 0) + (Number(b.sumatif) || 0) + (Number(b.sas) || 0) + (Number(b.psikomotor) || 0) + (Number(b.afektif) || 0);
      const pembagi = totalBobot > 0 ? totalBobot : 100;

      const hasAnyScore = cntF > 0 || cntS > 0 || sas > 0 || psiVals.length > 0 || afeVals.length > 0;
      const nilaiAkhirRaw = (
        avgFormatif * (Number(b.formatif) || 0) +
        avgSumatif * (Number(b.sumatif) || 0) +
        sas * (Number(b.sas) || 0) +
        avgPsikomotor * (Number(b.psikomotor) || 0) +
        avgAfektif * (Number(b.afektif) || 0)
      ) / pembagi;

      return {
        avgFormatif: Math.round(avgFormatif * 10) / 10,
        avgSumatif: Math.round(avgSumatif * 10) / 10,
        sas,
        avgPsikomotor: Math.round(avgPsikomotor * 10) / 10,
        avgAfektif: Math.round(avgAfektif * 10) / 10,
        nilaiAkhir: hasAnyScore ? Math.round(nilaiAkhirRaw) : 0,
        hasAnyScore
      };
    }

    function getRekapAbsensiSiswaSemester(siswaId, semester) {
      const manualKey = `${semester}|${siswaId}`;
      if (appData.rekapAbsensiManual && appData.rekapAbsensiManual[manualKey]) {
        const m = appData.rekapAbsensiManual[manualKey];
        return {
          sakit: Number(m.sakit) || 0,
          izin: Number(m.izin) || 0,
          alpa: Number(m.alpa) || 0
        };
      }
      let sakit = 0, izin = 0, alpa = 0;
      Object.entries(appData.absensi || {}).forEach(([k, v]) => {
        if (k.endsWith(`|${siswaId}`)) {
          if (v.status === 'Sakit') sakit++;
          else if (v.status === 'Izin') izin++;
          else if (v.status === 'Alpa') alpa++;
        }
      });
      return { sakit, izin, alpa };
    }

    function processImportSiswa(e) {
      e.preventDefault();
      const raw = document.getElementById('bulkSiswaTextarea').value.trim();
      if (!raw) return;
      const lines = raw.split(/\r?\n/);
      let added = 0;
      lines.forEach((line, idx) => {
        const parts = line.split(/\t|;/).map(p => p.trim());
        if (parts.length >= 3 && parts[2]) {
          appData.siswa.push({
            id: 'SIS-' + Date.now() + '-' + idx,
            nis: parts[0] || '-',
            nisn: parts[1] || '-',
            nama: parts[2],
            jk: (parts[3] || 'L').toUpperCase().startsWith('P') ? 'P' : 'L',
            kelas: appData.profil.kelasAktif
          });
          added++;
        }
      });
      saveAppData();
      closeModal();
      renderApp();
      showToast(`${added} siswa berhasil diimpor.`);

    function setAbsensiStatus(siswaId, status) {
      const key = `${uiState.absensiDate}|${siswaId}`;
      const cur = appData.absensi[key] || { status: 'Hadir', keterangan: '' };
      cur.status = status;
      appData.absensi[key] = cur;
      saveAppData(true);
      renderApp();
    }

    function setAbsensiKeterangan(siswaId, ket) {
      const key = `${uiState.absensiDate}|${siswaId}`;
      const cur = appData.absensi[key] || { status: 'Hadir', keterangan: '' };
      cur.keterangan = ket;
      appData.absensi[key] = cur;
      saveAppData(true);
    }

    function markAllHadir() {
      appData.siswa.forEach(s => {
        appData.absensi[`${uiState.absensiDate}|${s.id}`] = { status: 'Hadir', keterangan: '' };
      });
      saveAppData();
      renderApp();
    }

    function syncAbsensiHarianToRekap() {
      const semester = appData.profil.semesterAktif;
      appData.siswa.forEach(s => {
        let sakit = 0, izin = 0, alpa = 0;
        Object.entries(appData.absensi || {}).forEach(([k, v]) => {
          if (k.endsWith(`|${s.id}`)) {
            if (v.status === 'Sakit') sakit++;
            else if (v.status === 'Izin') izin++;
            else if (v.status === 'Alpa') alpa++;
          }
        });
        appData.rekapAbsensiManual[`${semester}|${s.id}`] = { sakit, izin, alpa };
      });
      saveAppData();
      renderApp();
      showToast('Akumulasi absensi harian berhasil disinkronkan ke Rekap Rapor.');
    }

    function updateRekapAbsensiManual(siswaId, field, val) {
      const semester = appData.profil.semesterAktif;
      const key = `${semester}|${siswaId}`;
      const cur = getRekapAbsensiSiswaSemester(siswaId, semester);
      cur[field] = Math.max(0, parseInt(val, 10) || 0);
      appData.rekapAbsensiManual[key] = cur;
      saveAppData(true);
      renderApp();
    }

    function updateNilaiTP(siswaId, tpId, jenis, val) {
      const key = `${appData.profil.semesterAktif}|${uiState.selectedMapelId}|${siswaId}`;
      if (!appData.nilaiKognitif[key]) appData.nilaiKognitif[key] = { tpScores: {}, sas: '' };
      if (!appData.nilaiKognitif[key].tpScores[tpId]) appData.nilaiKognitif[key].tpScores[tpId] = { formatif: '', sumatif: '' };
      appData.nilaiKognitif[key].tpScores[tpId][jenis] = val === '' ? '' : Math.max(0, Math.min(100, Number(val)));
      saveAppData(true);
      renderApp();
    }

    function updateNilaiSAS(siswaId, val) {
      const key = `${appData.profil.semesterAktif}|${uiState.selectedMapelId}|${siswaId}`;
      if (!appData.nilaiKognitif[key]) appData.nilaiKognitif[key] = { tpScores: {}, sas: '' };
      appData.nilaiKognitif[key].sas = val === '' ? '' : Math.max(0, Math.min(100, Number(val)));
      saveAppData(true);

    function generateDeskripsiKokurikuler(siswaId, semester) {
      const cfg = appData.kokurikulerConfig;
      const key = `${semester}|${siswaId}`;
      const entry = appData.nilaiKokurikuler[key];
      if (entry && entry.customDeskripsi && entry.customDeskripsi.trim()) {
        return entry.customDeskripsi.trim();
      }
      if (!entry || !entry.scores || !cfg.kegiatan.length) return '';

      let maxScore = -1, minScore = 99;
      const highList = [], lowList = [];

      cfg.kegiatan.forEach(k => {
        const sc = Number(entry.scores[k.id]) || 0;
        if (sc > 0) {
          if (sc > maxScore) maxScore = sc;
          if (sc < minScore) minScore = sc;
        }
      });

      if (maxScore < 0) return '';

      cfg.kegiatan.forEach(k => {
        const sc = Number(entry.scores[k.id]) || 0;
        if (sc === maxScore) highList.push(k.teks.replace(/\.$/, ''));
        else if (sc === minScore && minScore < maxScore) lowList.push(k.teks.replace(/\.$/, ''));
      });

      let teks = `Dalam proyek tema "${cfg.tema}", ananda nampak baik aktivitas ${highList.slice(0, 2).join(' serta ')}.`;
      if (lowList.length) {
        teks += ` Namun masih perlu bimbingan dalam ${lowList[0]}.`;
      }
      return teks;
    }

    function openJenisEkskulModal() {
      openModal('Kelola Master Jenis Ekstrakurikuler', `
        <div class="space-y-4">
          <form onsubmit="addJenisEkskul(event)" class="flex items-center gap-2">
            <input type="text" id="newJenisEkskulInput" placeholder="Nama ekskul baru (misal: Robotik / Paduan Suara)..." required class="flex-1 px-3 py-2 text-xs border border-slate-300 rounded-xl focus:border-emerald-600 focus:outline-none" />
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold">+ Tambah</button>
          </form>
          <div class="space-y-2 max-h-64 overflow-y-auto">
            ${appData.jenisEkskul.map((j, idx) => `
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                <input type="text" value="${esc(j)}" onchange="renameJenisEkskul(${idx}, this.value)" class="flex-1 px-2 py-1 text-xs font-semibold border border-slate-200 rounded-lg bg-white" />
                <button type="button" onclick="deleteJenisEkskul(${idx})" class="p-1.5 text-rose-600 hover:bg-rose-100 rounded-lg" title="Hapus">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            `).join('')}

    function addJenisEkskul(e) {
      e.preventDefault();
      const val = document.getElementById('newJenisEkskulInput').value.trim();
      if (!val) return;
      if (!appData.jenisEkskul.includes(val)) {
        appData.jenisEkskul.push(val);
        saveAppData();
      }
      openJenisEkskulModal();
    }

    function renameJenisEkskul(idx, val) {
      if (val.trim()) {
        appData.jenisEkskul[idx] = val.trim();
        saveAppData(true);
      }
    }

    function deleteJenisEkskul(idx) {
      appData.jenisEkskul.splice(idx, 1);
      saveAppData();
      openJenisEkskulModal();
    }

    function openEkskulSiswaModal(presetSiswaId = '', ekskulItemId = '') {
      const existing = ekskulItemId ? appData.nilaiEkskul.find(e => e.id === ekskulItemId) : null;
      const targetSiswaId = existing ? existing.siswaId : (presetSiswaId || appData.siswa[0]?.id || '');

      openModal(existing ? 'Edit Nilai Ekstrakurikuler Siswa' : 'Tambah Nilai Ekstrakurikuler Siswa', `
        <form onsubmit="saveEkskulSiswa(event, '${esc(ekskulItemId)}')" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Pilih Peserta Didik</label>
            <select id="eksSiswaSelect" ${presetSiswaId || existing ? 'disabled' : ''} class="w-full px-3 py-2 text-xs font-bold border border-slate-300 rounded-xl bg-white">
              ${appData.siswa.map(s => `<option value="${s.id}" ${s.id === targetSiswaId ? 'selected' : ''}>${esc(s.nama)} (NISN: ${esc(s.nisn)})</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Jenis Ekstrakurikuler</label>
            <select id="eksNamaSelect" class="w-full px-3 py-2 text-xs font-bold border border-slate-300 rounded-xl bg-white">
              ${appData.jenisEkskul.map(j => `<option value="${esc(j)}" ${existing?.namaEkskul === j ? 'selected' : ''}>${esc(j)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Predikat Capaian</label>
            <select id="eksPredikatSelect" class="w-full px-3 py-2 text-xs font-bold border border-slate-300 rounded-xl bg-white">
              ${['Sangat Baik', 'Baik', 'Cukup', 'Perlu Bimbingan'].map(pr => `<option value="${pr}" ${(!existing && pr === 'Sangat Baik') || existing?.predikat === pr ? 'selected' : ''}>${pr}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Keterangan / Deskripsi Kegiatan</label>
            <textarea id="eksDeskripsiInput" rows="3" placeholder="Contoh: aktif / Mengikuti latihan rutin dengan disiplin dan menunjukkan kerja sama yang baik." class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:border-emerald-600 focus:outline-none">${esc(existing?.deskripsi || 'aktif')}</textarea>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold">Simpan Nilai Ekskul</button>
          </div>
        </form>
      `);
    }

    function saveEkskulSiswa(e, ekskulItemId) {
      e.preventDefault();
      const siswaId = document.getElementById('eksSiswaSelect').value;
      const namaEkskul = document.getElementById('eksNamaSelect').value;
      const predikat = document.getElementById('eksPredikatSelect').value;
      const deskripsi = document.getElementById('eksDeskripsiInput').value.trim() || 'aktif';
      const semester = appData.profil.semesterAktif;

      if (ekskulItemId) {
        const item = appData.nilaiEkskul.find(x => x.id === ekskulItemId);
        if (item) {
          item.namaEkskul = namaEkskul;
          item.predikat = predikat;
          item.deskripsi = deskripsi;
        }
      } else {
        appData.nilaiEkskul.push({
          id: 'EKS-' + Date.now(),
          siswaId,
          semester,
          namaEkskul,
          predikat,
          deskripsi
        });
      }
      saveAppData();
      closeModal();
      renderApp();
    }

    function deleteEkskulItem(ekskulItemId) {
      appData.nilaiEkskul = appData.nilaiEkskul.filter(x => x.id !== ekskulItemId);
      saveAppData();
      renderApp();
      showToast('Data ekstrakurikuler dihapus.');
    }

              <div>

            <div class="flex justify-end">
              <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold">+ Simpan ke Jurnal</button>

          </form>

          <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden print-card">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-900 text-white">
                    <th class="py-3 px-4 w-28">Tanggal</th>
                    <th class="py-3 px-4 w-48">Mapel &amp; TP</th>
                    <th class="py-3 px-4">Materi Pokok</th>

    function addJurnalEntry(e) {
      e.preventDefault();
      appData.jurnal.unshift({
        id: 'JRN-' + Date.now(),
        tanggal: document.getElementById('jrnTanggal').value,
        semester: appData.profil.semesterAktif,
        mapelId: document.getElementById('jrnMapel').value,
        tpId: document.getElementById('jrnTp').value,
        materi: document.getElementById('jrnMateri').value.trim(),
        refleksi: document.getElementById('jrnRefleksi').value.trim(),
        tindakLanjut: document.getElementById('jrnTindak').value.trim()
      });
      saveAppData();
      renderApp();
    }

    function deleteJurnal(id) {
      appData.jurnal = appData.jurnal.filter(j => j.id !== id);
      saveAppData();
      renderApp();
    }

              <button type="button" onclick="window.print()" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5">

    function openJadwalModal(jadwalId = '') {
      const existing = jadwalId ? appData.jadwal.find(j => j.id === jadwalId) : null;

              <label class="block text-xs font-bold text-slate-700 mb-1">Hari</label>
              <select id="jdwHari" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl">
                ${hariList.map(h => `<option value="${h}" ${existing?.hari === h ? 'selected' : ''}>${h}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Jam Pelajaran</label>
              <input type="text" id="jdwJam" value="${esc(existing?.jam || '07.30 - 08.40')}" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran</label>
            <select id="jdwMapel" class="w-full px-3 py-2 text-xs font-bold border border-slate-300 rounded-xl">
              ${appData.mapel.map(m => `<option value="${m.id}" ${existing?.mapelId === m.id ? 'selected' : ''}>${esc(m.nama)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Keterangan / Guru</label>
            <input type="text" id="jdwKet" value="${esc(existing?.keterangan || 'Wali Kelas')}" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl" />
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold">Simpan Jadwal</button>
          </div>
        </form>

    function saveJadwal(e, jadwalId) {
      e.preventDefault();
      const hari = document.getElementById('jdwHari').value;
      const jam = document.getElementById('jdwJam').value.trim();
      const mapelId = document.getElementById('jdwMapel').value;
      const keterangan = document.getElementById('jdwKet').value.trim();

      if (jadwalId) {
        const j = appData.jadwal.find(x => x.id === jadwalId);

    function buildCapaianKompetensiMapel(siswaId, mapelId, semester) {
      const key = `${semester}|${mapelId}|${siswaId}`;
      const kog = appData.nilaiKognitif[key];
      const tps = getTPsForMapelSemester(mapelId, semester);

      if (!tps.length || !kog || !kog.tpScores) {
        return {
          tinggi: 'Ananda menunjukkan pemahaman yang baik dalam mengikuti pembelajaran pada semester ini.',
          rendah: ''
        };
      }

      const scoredTPs = tps.map(tp => {
        const sc = kog.tpScores[tp.id] || {};
        const vals = [sc.formatif, sc.sumatif].filter(v => v !== '' && v !== undefined && !isNaN(Number(v))).map(Number);
        const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
        return { tp, avg };
      }).filter(item => item.avg !== null);

      if (!scoredTPs.length) {
        return {
          tinggi: 'Ananda menunjukkan pemahaman yang baik dalam mengikuti pembelajaran pada semester ini.',
          rendah: ''
        };
      }

      scoredTPs.sort((a, b) => b.avg - a.avg);
      const best = scoredTPs[0];
      const worst = scoredTPs[scoredTPs.length - 1];
      const predKata = best.avg >= 90 ? 'sangat baik' : 'baik';

      const tinggi = `Ananda menunjukkan pemahaman ${predKata} dalam ${best.tp.deskripsi.replace(/\.$/, '')}.`;
      const rendah = scoredTPs.length > 1 && worst.avg < best.avg
        ? `Ananda masih perlu bimbingan dalam ${worst.tp.deskripsi.replace(/\.$/, '')}.`
        : '';

      return { tinggi, rendah };
    }

            </table>
          </div>

          <!-- D. Ketidakhadiran (Hasil Rekap Daftar Hadir) & E. Catatan Wali Kelas -->
          <div class="grid grid-cols-1 md:grid-cols-12 gap-5 mb-8 page-break-inside-avoid">
            <!-- D. Ketidakhadiran -->
            <div class="md:col-span-5">
              <h3 class="font-heading font-bold text-xs sm:text-sm text-slate-900 mb-2">D. Ketidakhadiran</h3>
              <table class="w-full border-collapse border border-slate-400 text-xs">
                <tbody>
                  <tr>
                    <td class="border border-slate-400 py-2 px-3 font-medium text-slate-800">Sakit</td>
                    <td class="border border-slate-400 py-2 px-3 text-right font-bold w-28">
                      <input type="number" min="0" value="${absenRekap.sakit}" onchange="updateRekapAbsensiManual('${siswa.id}', 'sakit', this.value)" class="w-12 px-1 py-0.5 text-right font-bold border border-emerald-300 rounded no-print" />
                      <span class="print-only-block inline">${absenRekap.sakit}</span> hari
                    </td>
                  </tr>
                  <tr>
                    <td class="border border-slate-400 py-2 px-3 font-medium text-slate-800">Izin</td>
                    <td class="border border-slate-400 py-2 px-3 text-right font-bold">
                      <input type="number" min="0" value="${absenRekap.izin}" onchange="updateRekapAbsensiManual('${siswa.id}', 'izin', this.value)" class="w-12 px-1 py-0.5 text-right font-bold border border-emerald-300 rounded no-print" />
                      <span class="print-only-block inline">${absenRekap.izin}</span> hari
                    </td>
                  </tr>
                  <tr>
                    <td class="border border-slate-400 py-2 px-3 font-medium text-slate-800">Tanpa Keterangan</td>
                    <td class="border border-slate-400 py-2 px-3 text-right font-bold">
                      <input type="number" min="0" value="${absenRekap.alpa}" onchange="updateRekapAbsensiManual('${siswa.id}', 'alpa', this.value)" class="w-12 px-1 py-0.5 text-right font-bold border border-emerald-300 rounded no-print" />
                      <span class="print-only-block inline">${absenRekap.alpa}</span> hari
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- E. Catatan Wali Kelas -->
            <div class="md:col-span-7">
              <h3 class="font-heading font-bold text-xs sm:text-sm text-slate-900 mb-2">E. Catatan Wali Kelas</h3>
              <div class="border border-slate-400 rounded-none p-3 min-h-[106px] bg-slate-50/40">
                <textarea rows="4" onchange="updateCatatanRapor('${siswa.id}', this.value)" placeholder="Tuliskan catatan motivasi dan perkembangan peserta didik selama satu semester..." class="w-full text-xs text-slate-800 bg-transparent border border-emerald-200 rounded-lg p-2 focus:bg-white focus:border-emerald-600 focus:outline-none leading-relaxed no-print">${esc(catatanWali)}</textarea>
                <div class="print-only-block text-xs text-slate-900 leading-relaxed">
                  ${esc(catatanWali || 'Pertahankan semangat belajar, kedisiplinan, dan akhlak mulia baik di sekolah maupun di rumah.')}
                </div>
              </div>
            </div>
          </div>

          <!-- Tanda Tangan Resmi Rapor -->
          <div class="pt-2 text-xs text-slate-900 page-break-inside-avoid">
            <div class="grid grid-cols-2 gap-8">
              <div class="text-center">
                <div>Mengetahui,</div>
                <div>Orang Tua / Wali</div>
                <div class="h-16"></div>
                <div class="font-bold">................................................</div>
              </div>
              <div class="text-center">
                <div>${esc(kotaSekolah)}, ${esc(tanggalRaporStr)}</div>
                <div>Wali Kelas ${esc(p.kelasAktif)}</div>
                <div class="h-16"></div>
                <div class="font-bold underline">${esc(p.namaGuru)}</div>
                <div>NIP. ${esc(p.nipGuru || '-')}</div>
              </div>
            </div>
            <div class="text-center mt-6">
              <div>Mengetahui,</div>
              <div>Kepala Sekolah</div>
              <div class="h-16"></div>
              <div class="font-bold underline">${esc(p.kepalaSekolah)}</div>
              <div>NIP. ${esc(p.nipKepsek || '-')}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderRapor() {
      const students = getFilteredStudents();
      if (!students.some(s => s.id === uiState.selectedRaporSiswaId) && students.length) {
        uiState.selectedRaporSiswaId = students[0].id;
      }
      const selectedStudent = students.find(s => s.id === uiState.selectedRaporSiswaId) || appData.siswa[0];

      const sheetsHtml = uiState.printAllRaporMode
        ? appData.siswa.map((s, i) => renderSingleRaporSheet(s, i === appData.siswa.length - 1)).join('')
        : (selectedStudent ? renderSingleRaporSheet(selectedStudent, true) : '');

      return `
        <div class="space-y-5">
          <!-- Toolbar Pemilihan Siswa & Tombol Cetak -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-3 no-print">
            <div class="flex flex-wrap items-center gap-2.5">
              <label class="text-xs font-bold text-slate-700">Pilih Peserta Didik:</label>
              <select onchange="uiState.selectedRaporSiswaId = this.value; uiState.printAllRaporMode = false; renderApp();" class="px-3 py-2 text-xs font-bold border border-emerald-300 rounded-xl bg-emerald-50 text-emerald-950">
                ${appData.siswa.map((s, i) => `<option value="${s.id}" ${s.id === selectedStudent?.id ? 'selected' : ''}>${i + 1}. ${esc(s.nama)} (NISN: ${esc(s.nisn)})</option>`).join('')}
              </select>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="printSingleRapor()" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="printer" class="w-4 h-4"></i> Cetak Rapor Siswa Ini
              </button>
              <button type="button" onclick="printAllRapor()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5">
                <i data-lucide="files" class="w-4 h-4"></i> Cetak Semua Rapor (${appData.siswa.length})
              </button>
            </div>
          </div>

          ${sheetsHtml}
        </div>
      `;
    }

    function updateCatatanRapor(siswaId, val) {
      const key = `${appData.profil.semesterAktif}|${siswaId}`;
      appData.catatanRapor[key] = val.trim();
      saveAppData(true);
      showToast('Catatan wali kelas tersimpan.');
    }

    function printSingleRapor() {
      uiState.printAllRaporMode = false;
      renderApp();
      setTimeout(() => window.print(), 150);
    }

    function printAllRapor() {
      uiState.printAllRaporMode = true;
      renderApp();
      setTimeout(() => {
        window.print();
        uiState.printAllRaporMode = false;
        renderApp();
      }, 250);
    }

    // ========================================================================
    // INISIALISASI & ROUTER RENDER UTAMA
    // ========================================================================
    function renderApp() {
      const container = document.getElementById('pageContainer');
      if (!container) return;

      let html = '';
      switch (uiState.currentPage) {
        case 'beranda': html = renderBeranda(); break;
        case 'profil': html = renderProfil(); break;
        case 'kelas': html = renderKelas(); break;
        case 'absensi': html = renderAbsensi(); break;
        case 'nilai': html = renderNilai(); break;
        case 'pengolah': html = renderPengolah(); break;
        case 'kokurikuler': html = renderKokurikuler(); break;
        case 'ekskul': html = renderEkskul(); break;
        case 'jurnal': html = renderJurnal(); break;
        case 'jadwal': html = renderJadwal(); break;
        case 'poin': html = renderPoin(); break;
        case 'rapor': html = renderRapor(); break;
        default: html = renderBeranda();
      }

      container.innerHTML = html;
      refreshIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      appData = loadAppData();
      updateTopbarAndSidebar();
      navigate('beranda');
    });
  </script>
</body>
</html>
